name: Android worker

on:
  push:
    branches: [main]
    paths:
      - "mobile-worker/**"
      - "proto/cluster_rpc.proto"
      - ".github/workflows/android-worker.yml"
  pull_request:
    paths:
      - "mobile-worker/**"
      - "proto/cluster_rpc.proto"
      - ".github/workflows/android-worker.yml"

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-worker/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Proto drift guard
        run: ./gradlew --no-daemon checkProtoInSync

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-debug-apk
          path: mobile-worker/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
