name: Android worker

on:
  push:
    branches: [main]
    paths:
      - "mobile-worker/**"
      - "proto/cluster_rpc.proto"
      - ".github/workflows/android-worker.yml"
  pull_request:
    paths:
      - "mobile-worker/**"
      - "proto/cluster_rpc.proto"
      - ".github/workflows/android-worker.yml"

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-worker/android
    steps:
      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Use the Android SDK preinstalled on the runner image; the
      # `android-actions/setup-android` action currently fails because it tries
      # to install the removed `tools` meta-package.
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Proto drift guard
        run: ./gradlew --no-daemon checkProtoInSync

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-debug-apk
          path: mobile-worker/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
