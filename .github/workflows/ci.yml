name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  core:
    name: Core (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml, not in this workflow:
      # CI formats, lints and tests with exactly the compiler a checkout uses.
      - name: Setup Rust Toolchain
        run: |
          # Install the exact toolchain pinned in rust-toolchain.toml; rustup
          # activates it from that file in this repository. Then fail loudly if
          # some other toolchain is active, so this pin cannot silently rot.
          pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$pin" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup show active-toolchain | grep -q "$pin" || { echo "::error::active toolchain is not the pinned $pin"; exit 1; }

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint (clippy, deny warnings)
        run: cargo clippy -p ai-upcycler-core --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p ai-upcycler-core

  worker:
    name: Worker engine (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml, not in this workflow:
      # CI formats, lints and tests with exactly the compiler a checkout uses.
      - name: Setup Rust Toolchain
        run: |
          # Install the exact toolchain pinned in rust-toolchain.toml; rustup
          # activates it from that file in this repository. Then fail loudly if
          # some other toolchain is active, so this pin cannot silently rot.
          pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$pin" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup show active-toolchain | grep -q "$pin" || { echo "::error::active toolchain is not the pinned $pin"; exit 1; }

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint worker crate (clippy, deny warnings)
        run: cargo clippy -p ai-upcycler-worker --all-targets -- -D warnings

      - name: Run worker tests
        run: cargo test -p ai-upcycler-worker

  model-io:
    name: Model I/O (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml, not in this workflow:
      # CI formats, lints and tests with exactly the compiler a checkout uses.
      - name: Setup Rust Toolchain
        run: |
          # Install the exact toolchain pinned in rust-toolchain.toml; rustup
          # activates it from that file in this repository. Then fail loudly if
          # some other toolchain is active, so this pin cannot silently rot.
          pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$pin" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup show active-toolchain | grep -q "$pin" || { echo "::error::active toolchain is not the pinned $pin"; exit 1; }

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint model-io crate (clippy, deny warnings)
        run: cargo clippy -p ai-upcycler-model-io --all-targets -- -D warnings

      - name: Run model-io tests
        run: cargo test -p ai-upcycler-model-io

  desktop:
    name: Desktop shell (Tauri v2, Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml, not in this workflow:
      # CI formats, lints and tests with exactly the compiler a checkout uses.
      - name: Setup Rust Toolchain
        run: |
          # Install the exact toolchain pinned in rust-toolchain.toml; rustup
          # activates it from that file in this repository. Then fail loudly if
          # some other toolchain is active, so this pin cannot silently rot.
          pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$pin" --profile minimal --component rustfmt --component clippy --no-self-update
          rustup show active-toolchain | grep -q "$pin" || { echo "::error::active toolchain is not the pinned $pin"; exit 1; }

      # Tauri v2 links against webkit2gtk-4.1 (libsoup3) on Linux.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'

      - name: Lint desktop shell (clippy, deny warnings)
        run: cargo clippy -p ai-upcycler-desktop --all-targets -- -D warnings

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and Build
        run: pnpm build
