name: Release Build (Windows, macOS, Linux, Android APK)

on:
  # Releases are cut from version tags only. Triggering on every push to main
  # would re-run against the same `v__VERSION__` tag and reuse an existing
  # release, so main merges are validated by CI instead (see ci.yml).
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      # One bad platform must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            label: 'macOS (universal .dmg / .app)'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            label: 'Linux (.deb / .rpm / .AppImage)'
            rust-targets: ''
            args: ''
          - platform: 'windows-latest'
            label: 'Windows (.msi / .exe)'
            rust-targets: ''
            args: ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # The toolchain is pinned in rust-toolchain.toml; only the per-platform
      # cross-compilation targets are added here.
      - name: Setup Rust Toolchain
        shell: bash
        run: |
          # Install the exact toolchain pinned in rust-toolchain.toml, add the
          # platform's cross-compilation targets, then fail loudly if some other
          # toolchain is active, so the pin cannot silently rot.
          pin=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$pin" --profile minimal --no-self-update
          targets="${{ matrix.rust-targets }}"
          if [ -n "$targets" ]; then
            rustup target add --toolchain "$pin" ${targets//,/ }
          fi
          rustup show active-toolchain | grep -q "$pin" || { echo "::error::active toolchain is not the pinned $pin"; exit 1; }

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'

      # Tauri v2 links against webkit2gtk-4.1 (libsoup3), which ships in Ubuntu 22.04.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build and Publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AI Upcycler v__VERSION__'
          releaseBody: 'Automated cross-platform release generated by GitHub Actions on version tags.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # The phone agent's side-load asset rides the same tag release as the
  # desktop installers (tasks.md section 2, "Package and publish the Android
  # .apk worker asset"). Debug build, deliberately: the worker has no release
  # signing config and is installed by side-loading (`adb install`), which is
  # the documented phone-agent install path - an unsigned release build would
  # not be installable.
  publish-android-apk:
    name: Build + publish Android worker APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile-worker/android
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Same recipe as android-worker.yml: use the Android SDK preinstalled on
      # the runner image (android-actions/setup-android fails on the removed
      # `tools` meta-package), install the platform/build-tools the project
      # targets, and point Gradle at it via local.properties.
      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # Always published as a workflow artifact: workflow_dispatch runs from a
      # branch where there is no release to attach to, and an artifact keeps
      # every run's APK retrievable.
      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: worker-apk
          path: mobile-worker/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Tag runs attach the APK to the GitHub Release the desktop matrix
      # creates. Wait for that release instead of racing (or pre-creating)
      # it - the tauri-action jobs own release creation, title and body. If
      # every desktop build fails the release never appears; the bounded wait
      # ends and the upload fails loudly, failing the run either way.
      - name: Attach APK to the release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          for _ in $(seq 1 60); do
            if gh release view "$TAG" > /dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release upload "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk#aiupcycler-worker-${TAG}-debug.apk" \
            --clobber
