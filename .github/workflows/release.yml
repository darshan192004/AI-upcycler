name: Automated Release Build (Windows .exe & Android .apk)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows-exe:
    name: Build Windows Desktop Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build Tauri Desktop Executable (.exe)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AI Upcycler v__VERSION__'
          releaseBody: 'Automated release generated by GitHub Actions CI/CD on merge to main.'
          releaseDraft: false
          prerelease: false
