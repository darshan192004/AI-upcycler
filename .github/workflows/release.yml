name: Release Build (Windows, macOS, Linux)

on:
  # Releases are cut from version tags only. Triggering on every push to main
  # would re-run against the same `v__VERSION__` tag and reuse an existing
  # release, so main merges are validated by CI instead (see ci.yml).
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      # One bad platform must not cancel the others.
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            label: 'macOS (universal .dmg / .app)'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            label: 'Linux (.deb / .rpm / .AppImage)'
            rust-targets: ''
            args: ''
          - platform: 'windows-latest'
            label: 'Windows (.msi / .exe)'
            rust-targets: ''
            args: ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '.'

      # Tauri v2 links against webkit2gtk-4.1 (libsoup3), which ships in Ubuntu 22.04.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install Frontend Dependencies
        run: pnpm install

      - name: Build and Publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'AI Upcycler v__VERSION__'
          releaseBody: 'Automated cross-platform release generated by GitHub Actions on version tags.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
