version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Cargo (Rust) dependencies for the whole workspace (core + src-tauri)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain npm/pnpm dependencies for Desktop GUI
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
