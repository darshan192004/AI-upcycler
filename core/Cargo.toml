[package]
name = "ai-upcycler-core"
version = "0.2.0"
description = "AI Upcycler master orchestration engine (pure Rust, no Tauri)"
license = "MIT"
authors = ["AI Upcycler Contributors"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14"
tonic = { version = "0.13", features = ["transport"] }
mdns-sd = "0.11"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

[build-dependencies]
tonic-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }