[package]
name = "ai-upcycler-core"
version = "0.2.0"
description = "AI Upcycler master orchestration engine (pure Rust, no Tauri)"
license = "MIT"
authors = ["AI Upcycler Contributors"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.13"
tonic = { version = "0.13", features = ["transport", "tls-ring"] }
mdns-sd = "0.11"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tracing = "0.1"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2.0"
uuid = { version = "1.8", features = ["v4"] }
futures = "0.3"
async-stream = "0.3"
memmap2 = "0.9"
bytes = "1"
rcgen = "0.13"
sha2 = "0.10"

[build-dependencies]
tonic-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }