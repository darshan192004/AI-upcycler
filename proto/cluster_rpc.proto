syntax = "proto3";

package aiupcycler.rpc;

service WorkerService {
  rpc Handshake (HandshakeRequest) returns (HandshakeResponse);
  rpc LoadLayers (LoadLayersRequest) returns (LoadLayersResponse);
  rpc ExecuteForward (ExecuteForwardRequest) returns (ExecuteForwardResponse);
  rpc UnloadLayers (UnloadLayersRequest) returns (UnloadLayersResponse);
  rpc GetHealthStatus (HealthRequest) returns (HealthResponse);
  rpc Benchmark (BenchmarkRequest) returns (BenchmarkResponse);
  // Model provisioning (spec 2026-11-03-model-provisioning, D-P1). Three calls
  // because a client-streaming reply cannot carry the resume offset back
  // before the stream starts.
  rpc BeginModelPush (BeginModelPushRequest) returns (BeginModelPushResponse);
  rpc PushModelChunks (stream ModelChunk) returns (PushModelChunksResponse);
  rpc FinishModelPush (FinishModelPushRequest) returns (FinishModelPushResponse);
}

message HandshakeRequest {
  string master_id = 1;
  string protocol_version = 2;
  int64 timestamp = 3;
}

message HandshakeResponse {
  string worker_id = 1;
  string device_name = 2;
  int64 total_ram_bytes = 3;
  int64 free_ram_bytes = 4;
  int32 cpu_cores = 5;
  bool has_npu_acceleration = 6;
  // This worker honours ExecuteForwardRequest.last_logits_only.
  bool supports_last_row_logits = 7;
}

message LoadLayersRequest {
  string model_id = 1;
  int32 start_layer = 2;
  int32 end_layer = 3;
  bytes weights_chunk_data = 4;
}

message LoadLayersResponse {
  bool success = 1;
  string error_message = 2;
  int64 allocated_ram_bytes = 3;
}

message UnloadLayersRequest {
  string model_id = 1;
}

message UnloadLayersResponse {
  bool success = 1;
  string error_message = 2;
  int64 freed_ram_bytes = 3;
}

message TensorBuffer {
  repeated int64 shape = 1;
  enum DataType {
    FP32 = 0;
    FP16 = 1;
    BF16 = 2;
  }
  DataType data_type = 2;
  bytes raw_data = 3;
}

message ExecuteForwardRequest {
  string session_id = 1;
  int32 start_layer = 2;
  int32 end_layer = 3;
  TensorBuffer activation_tensor = 4;
  int32 sequence_position = 5;
  // Return logits for the last input row only: the head stage answers with
  // shape [1, n_vocab] instead of [n, n_vocab]. A stage that is not the head
  // ignores it, and a worker without HandshakeResponse.supports_last_row_logits
  // ignores it too (proto3 unknown field), falling back to whole logits.
  bool last_logits_only = 6;
}

message ExecuteForwardResponse {
  bool success = 1;
  TensorBuffer output_activation_tensor = 2;
  int64 execution_time_us = 3;
}

message HealthRequest {}

message HealthResponse {
  float battery_percentage = 1;
  float cpu_temp_celsius = 2;
  int64 free_ram_bytes = 3;
  // Whether this worker can execute layer RPCs, i.e. a model engine is open.
  // A metadata-only worker still answers health but must never be planned over.
  bool supports_compute = 4;
}

// Measures this worker's own hardware: bounded, sub-second probes run on
// demand by the master (spec 2026-10-21, D-C1/D-C2). No request fields: the
// probe shape is fixed so two masters always compare like with like.
message BenchmarkRequest {}

message BenchmarkResponse {
  // Sequential read+write throughput over a fixed buffer (MiB/s scale).
  double memory_bandwidth_mbs = 1;
  // Single-threaded f32 fused multiply-add rate (FLOP/s scale).
  double throughput_flops = 2;
  // The worker's own wall time for both probes, for degenerate-run sanity.
  double probe_duration_ms = 3;
}

// --- Model provisioning -----------------------------------------------------

message BeginModelPushRequest {
  string model_id = 1;
  // Bare file name ending in `.gguf`; the worker rejects a path.
  string file_name = 2;
  int64 total_bytes = 3;
  // Lowercase hex SHA-256 of the whole file. It is also the resume contract:
  // a partial whose recorded digest differs is discarded (D-P3).
  string sha256_hex = 4;
}

message BeginModelPushResponse {
  bool accepted = 1;
  string error_message = 2;
  // Bytes the worker already holds and verified against the same digest.
  int64 resume_from_bytes = 3;
}

message ModelChunk {
  // Must equal the number of bytes already written (D-P1 / spec section 4).
  int64 offset = 1;
  bytes data = 2;
}

message PushModelChunksResponse {
  bool success = 1;
  string error_message = 2;
  int64 received_bytes = 3;
}

message FinishModelPushRequest {
  string model_id = 1;
  string sha256_hex = 2;
}

message FinishModelPushResponse {
  bool success = 1;
  string error_message = 2;
  string model_path = 3;
  int64 size_bytes = 4;
  // Whether the worker reopened its engine on the new file. A verified file
  // with a failed engine start is still a successful transfer (D-P7).
  bool engine_started = 5;
}
