# PR-Agent configuration.
# Docs: https://docs.pr-agent.ai/usage-guide/configuration_options/
#
# Read from the repository root on every run. Secrets never live here: the
# provider keys are injected as env vars in .github/workflows/pr-agent.yml.
#
# Model chain: Gemini is primary; on quota exhaustion or provider failure
# PR-Agent falls back through the list in order. Groq's gpt-oss-120b answers
# fast on the developer tier, so it is tried first; OpenRouter's "free"
# router (free-tier models only) is the slow last resort.
# custom_model_max_tokens caps the output budget: without it, reasoning
# models on the chain burn the whole budget on thinking and return empty
# content with finish_reason "length".

[config]
model = "gemini/gemini-3.8-flash"
fallback_models = ["groq/openai/gpt-oss-120b", "openrouter/free"]
custom_model_max_tokens = 20000

# Generated lockfiles add thousands of unreviewable lines to the diff and push
# reviews into partial mode; keep them out of the review surface. The same
# applies to the committed engine fixtures (goldens, tiny GGUFs, forward
# vectors): machine-cut data whose only meaningful review target is the code
# that produces and replays them. Excluding them also keeps the prompt inside
# the fallback providers' request-size caps (groq on-demand allows a single
# request of at most 8000 tokens), so the fallback chain stays usable when
# Gemini is quota-blocked.
[ignore]
glob = ["Cargo.lock", "**/Cargo.lock", "pnpm-lock.yaml", "package-lock.json", "yarn.lock", "mobile-worker/android/app/src/test/resources/engine/**"]
