[package]
name = "ai-upcycler-desktop"
version = "0.2.0"
description = "AI Upcycler Desktop App (Tauri shell)"
authors = ["AI Upcycler Contributors"]
edition = "2021"

[lib]
name = "ai_upcycler_desktop_lib"
# The desktop shell's binary links the rlib. It does not target Tauri mobile;
# the Android worker is a separate crate. Building the cdylib here makes the
# MinGW linker emit "export ordinal too large" for this large Tauri dependency
# graph, so the shell only needs the rlib.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1.36", features = ["sync"] }
ai-upcycler-core = { path = "../core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
