[package]
name = "ai-upcycler-desktop"
version = "0.2.0"
description = "AI Upcycler Desktop App (Tauri shell)"
authors = ["AI Upcycler Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ai-upcycler-core = { path = "../core" }

[features]
custom-protocol = ["tauri/custom-protocol"]