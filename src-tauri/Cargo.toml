[package]
name = "ai-upcycler-core"
version = "0.1.0"
description = "AI Upcycler Master Orchestrator Core"
authors = ["AI Upcycler Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
prost = "0.12"
tonic = "0.10"
mdns-sd = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
