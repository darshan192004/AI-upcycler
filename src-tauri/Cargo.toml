[package]
name = "ai-upcycler-desktop"
version = "0.2.0"
description = "AI Upcycler Desktop App (Tauri shell)"
authors = ["AI Upcycler Contributors"]
edition = "2021"

[lib]
name = "ai_upcycler_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
ai-upcycler-core = { path = "../core" }

[features]
custom-protocol = ["tauri/custom-protocol"]